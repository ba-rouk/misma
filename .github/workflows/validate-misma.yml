name: Validate Misma

on:
  push:
    branches:
      - fix/misma-video-search-voice-settings
      - fix/media-generation-timeouts-composer-layout
      - feat/mobile-message-actions-composer
      - feat/voice-controls-composer-alignment
      - feat/business-workspace-navigation
      - feat/chat-library-performance-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Production build
        run: bun run build

      - name: Check Supabase chat Edge Function
        run: deno check supabase/functions/misma-chat/index.ts

      - name: Check public widget and channel Edge Function
        run: deno check supabase/functions/misma-widget/index.ts
